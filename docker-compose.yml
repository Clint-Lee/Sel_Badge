version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: badge_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: badge_auth
      MYSQL_USER: badge
      MYSQL_PASSWORD: badge_password
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  adminer:
    image: adminer:latest
    container_name: badge_adminer
    restart: always
    ports:
      - "8088:8080"
    depends_on:
      - mysql

volumes:
  mysql_data:
