TYPE=static
DEPLOY_BRANCH=main
PRE_CMD="mkdir -p /var/backups/badge && cp -f /srv/repo/Sel_Badge/backend/data/badge_auth_db.mv.db /var/backups/badge/ 2>/dev/null || true"
BUILD_CMD="npm --prefix frontend ci && npm --prefix frontend run build"
