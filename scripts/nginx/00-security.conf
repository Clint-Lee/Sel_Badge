# ==============================================================================
# Global Security Hardening Configuration for Antigravity Ecosystem
# ==============================================================================

# 1. Hide server software version in response headers
server_tokens off;

# 2. Connection limits to mitigate Slowloris and connection flooding
limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;

# 3. Rate limiting zones
# Strict limit for authentication & registration endpoints (5 requests per minute, burst 5)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# General API rate limiting (25 requests per second, burst 30)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=25r/s;

# WebSocket upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
