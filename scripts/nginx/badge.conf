server {
    listen 8080 default_server;
    listen 100;
    server_name _;

    limit_conn addr_conn_limit 30;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block sensitive files and vulnerability probing
    location ~* \.(git|env|sql|bak|old|swp|db|sqlite|log|ini|conf)$ {
        deny all;
        return 404;
    }
    location ~* /(phpmyadmin|pma|wp-admin|wp-login|actuator|telescope) {
        deny all;
        return 404;
    }

    # 1. Webhook automation endpoint
    location /deploy/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # 2. Strict rate limit on Auth sensitive API endpoints (Anti-brute force / credential stuffing)
    location ~ ^/api/auth/(login|register) {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
    }

    # 3. Badge Backend API Proxy (to internal Spring Boot on 8088)
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8088/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
    }

    # 4. Badge Frontend SPA
    location / {
        root /var/www/badge/current;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        root /var/www/badge/current;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
